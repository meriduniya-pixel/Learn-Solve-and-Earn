<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - Learn & Earn</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary-blue: #2563eb;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold-coin: #f59e0b;
      --success-green: #22c55e;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    /* Header */
    header {
      background-color: #0f172a;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-cyan);
      text-decoration: none;
    }

    .user-info {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Main Container */
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Wallet Banner Card */
    .wallet-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .coin-balance {
      font-size: 36px;
      font-weight: bold;
      color: var(--gold-coin);
      margin: 10px 0;
    }

    /* Section Cards */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .card h3 {
      margin-top: 0;
      color: var(--accent-cyan);
    }

    /* Forms & Inputs */
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background-color: var(--primary-blue);
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-logout {
      background-color: #ef4444;
      padding: 6px 12px;
      width: auto;
      font-size: 12px;
      margin: 0;
    }

    /* Video Frame Responsive */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="brand">🎯 Learn & Earn</a>
    <div class="user-info">
      <span id="displayUserEmail">Loading...</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">

    <!-- Wallet Balance Banner -->
    <div class="wallet-card">
      <div style="color: var(--text-muted); font-size: 14px;">YOUR TOTAL WALLET BALANCE</div>
      <div class="coin-balance">🪙 <span id="userCoins">0</span> Coins</div>
      <div style="font-size: 12px; color: var(--text-muted);">( 1000 Coins = ₹10 INR )</div>
    </div>

    <!-- Active Task Section -->
    <div class="card">
      <h3>🎬 Daily Video Task</h3>
      <div id="taskContainer">
        <div style="color: var(--text-muted);">Loading available task...</div>
      </div>
    </div>

    <!-- Redeem / Withdrawal Section -->
    <div class="card">
      <h3>🎁 Redeem Earnings</h3>
      <p style="font-size: 13px; color: var(--text-muted);">Minimum withdrawal requirement is 500 Coins (₹5).</p>
      
      <select id="payoutMethod">
        <option value="UPI">Direct UPI Cash</option>
        <option value="Amazon Voucher">Amazon Gift Card Voucher</option>
      </select>

      <input type="text" id="payoutDetails" placeholder="Enter UPI ID or Mobile No. for Gift Card">
      <input type="number" id="payoutCoins" placeholder="Enter Coins to Redeem (Min. 500)">
      
      <button onclick="requestWithdrawal()">Submit Redemption Request</button>
    </div>

  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Auth Check
    const userId = localStorage.getItem("userId");
    const userEmail = localStorage.getItem("userEmail");

    if (!userId || !userEmail) {
      alert("Please login first!");
      window.location.href = "index.html";
    } else {
      document.getElementById("displayUserEmail").innerText = userEmail;
    }

    let currentUserCoins = 0;

    // 1. Fetch User Coins in Realtime
    onValue(ref(database, 'users/' + userId), (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        currentUserCoins = data.coins || 0;
        document.getElementById("userCoins").innerText = currentUserCoins;
      }
    });

    // 2. Load Active Tasks
    let currentTaskAnswer = "";
    onValue(ref(database, 'tasks'), (snapshot) => {
      const container = document.getElementById("taskContainer");
      container.innerHTML = "";

      if (!snapshot.exists()) {
        container.innerHTML = "<div style='color: var(--text-muted);'>No new task available right now! Check back later.</div>";
        return;
      }

      // Display the latest task
      snapshot.forEach((child) => {
        const task = child.val();
        currentTaskAnswer = task.answer;

        // Extract Embed Youtube ID
        let embedUrl = task.videoUrl;
        if(task.videoUrl.includes("watch?v=")) {
          embedUrl = task.videoUrl.replace("watch?v=", "embed/");
        } else if(task.videoUrl.includes("youtu.be/")) {
          embedUrl = task.videoUrl.replace("youtu.be/", "www.youtube.com/embed/");
        }

        container.innerHTML = `
          <div class="video-container">
            <iframe src="${embedUrl}" allowfullscreen></iframe>
          </div>
          <h4>❓ Question: ${task.question}</h4>
          <input type="text" id="userAnswer" placeholder="Type your answer here...">
          <button onclick="submitTaskAnswer()">Submit Answer & Earn 1 Coin</button>
        `;
      });
    });

    // Submit Answer & Credit Coin
    window.submitTaskAnswer = function() {
      const ans = document.getElementById("userAnswer").value.trim();
      if (!ans) return alert("Please type an answer!");

      if (ans.toLowerCase() === currentTaskAnswer.toLowerCase()) {
        const newCoins = currentUserCoins + 1;
        update(ref(database, 'users/' + userId), { coins: newCoins })
          .then(() => {
            alert("🎉 Correct Answer! 1 Coin credited to your wallet.");
            document.getElementById("userAnswer").value = "";
          });
      } else {
        alert("❌ Incorrect answer, please watch the video again carefully!");
      }
    };

    // 3. Request Withdrawal
    window.requestWithdrawal = function() {
      const method = document.getElementById("payoutMethod").value;
      const details = document.getElementById("payoutDetails").value.trim();
      const coinsToRedeem = parseInt(document.getElementById("payoutCoins").value);

      if (!details || isNaN(coinsToRedeem)) return alert("Please fill all details correctly.");
      if (coinsToRedeem < 500) return alert("Minimum withdrawal is 500 Coins!");
      if (coinsToRedeem > currentUserCoins) return alert("Insufficient Coin balance!");

      // Deduct coins & create withdrawal record
      const updatedBalance = currentUserCoins - coinsToRedeem;
      
      update(ref(database, 'users/' + userId), { coins: updatedBalance }).then(() => {
        const newReqRef = push(ref(database, 'withdrawals'));
        set(newReqRef, {
          userId: userId,
          email: userEmail,
          method: method,
          details: details,
          coins: coinsToRedeem,
          amount: coinsToRedeem / 100, // ₹ Value
          status: 'pending',
          requestedAt: new Date().toISOString()
        }).then(() => {
          alert("✅ Withdrawal Request Submitted! Admin will process it within 24-48 hours.");
          document.getElementById("payoutDetails").value = "";
          document.getElementById("payoutCoins").value = "";
        });
      });
    };

    // Logout
    window.logout = function() {
      localStorage.clear();
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
