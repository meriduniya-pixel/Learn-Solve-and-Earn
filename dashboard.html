<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - Learn & Earn</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary-blue: #2563eb;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0f172a;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { font-size: 20px; font-weight: bold; color: var(--accent-cyan); }
    
    .logout-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .stats-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-box h3 { margin: 0; color: var(--accent-cyan); font-size: 28px; }
    .stat-box p { margin: 5px 0 0 0; color: var(--text-muted); font-size: 14px; }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .panel-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--accent-cyan); }

    .ref-box {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
    }

    .btn-copy {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .task-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-task {
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🎯 Learn & Earn Dashboard</div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </header>

  <div class="container">
    
    <!-- Stats Row -->
    <div class="stats-card">
      <div class="stat-box">
        <h3 id="userCoins">0</h3>
        <p>Total Coins</p>
      </div>
      <div class="stat-box">
        <h3 id="tasksCompleted">0</h3>
        <p>Tasks Done</p>
      </div>
    </div>

    <!-- Referral Section -->
    <div class="panel">
      <div class="panel-title">🔗 Your Referral Link</div>
      <div class="ref-box">
        <input type="text" id="refLinkInput" readonly value="Loading...">
        <button class="btn-copy" onclick="copyReferralLink()">Copy Link</button>
      </div>
    </div>

    <!-- Task Section -->
    <div class="panel">
      <div class="panel-title">🎬 Available Daily Task</div>
      <div class="task-card">
        <h4>Watch 5-8 Min Video & Answer Quiz</h4>
        <p style="color: var(--text-muted); font-size: 13px;">Complete the video timer and answer 1 question to get 1 Coin.</p>
        <button class="btn-task" onclick="completeTask()">Complete Task (+1 Coin)</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    let currentUserId = "";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.email.replace(/\./g, "_");
        
        // Referral link display
        const refUrl = window.location.origin + "/index.html?ref=" + currentUserId;
        document.getElementById("refLinkInput").value = refUrl;

        // Fetch User Data Realtime
        onValue(ref(database, 'users/' + currentUserId), (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            document.getElementById("userCoins").innerText = data.coins || 0;
            document.getElementById("tasksCompleted").innerText = data.tasksCompletedCount || 0;
          }
        });
      } else {
        window.location.href = "index.html";
      }
    });

    // Task Completion & Task-based Referral Rewards Engine
    window.completeTask = function() {
      if (!currentUserId) return;

      const userRef = ref(database, 'users/' + currentUserId);

      get(userRef).then((snapshot) => {
        if (snapshot.exists()) {
          const userData = snapshot.val();
          const currentCoins = userData.coins || 0;
          const currentTaskCount = (userData.tasksCompletedCount || 0) + 1;

          // Update current user's coins (+1) & completed task count
          update(userRef, {
            coins: currentCoins + 1,
            tasksCompletedCount: currentTaskCount
          });

          // Process Referrer Bonus Reward based on Task Number
          const referrerId = userData.referredBy;
          if (referrerId) {
            let refBonus = 0;
            
            if (currentTaskCount === 1) refBonus = 5;
            else if (currentTaskCount === 2) refBonus = 7;
            else if (currentTaskCount === 3) refBonus = 8;
            else if (currentTaskCount === 4) refBonus = 10;
            else if (currentTaskCount === 5) refBonus = 15;
            else if (currentTaskCount === 6) refBonus = 15;

            if (refBonus > 0) {
              const referrerRef = ref(database, 'users/' + referrerId);
              get(referrerRef).then((refSnap) => {
                if (refSnap.exists()) {
                  const refCoins = refSnap.val().coins || 0;
                  update(referrerRef, {
                    coins: refCoins + refBonus
                  });
                }
              });
            }
          }

          alert("🎉 Task Completed! You earned 1 Coin.");
        }
      });
    };

    window.copyReferralLink = function() {
      const copyText = document.getElementById("refLinkInput");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Referral link copied!");
    };

    window.handleLogout = function() {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };
  </script>
</body>
</html>
