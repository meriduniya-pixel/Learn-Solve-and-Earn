<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Task</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; border: 1px solid #334155; }
    .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 15px; border-radius: 8px; }
    .video-box iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }
    .quiz-box { display:none; background:#0f172a; padding:15px; border-radius:8px; margin-top:15px; border: 1px solid #475569; }
    button { padding:12px 15px; margin:8px 0; background:#334155; color:#fff; border:none; border-radius:5px; cursor:pointer; display:block; width:100%; text-align:left; font-size:14px; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>

  <div class="card">
    <h3 id="taskTitle">Loading Task...</h3>
    <div class="video-box"><div id="player"></div></div>
    <div id="timerDisplay">⏳ Watch Video: <span id="timeLeft">120</span>s</div>

    <div class="quiz-box" id="quizBox">
      <h4 id="qTitle">Quiz</h4>
      <div id="optionsBox"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://zerthuoblnivjhhjepd.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcnRodHVvYmxuaXZqaGhqZXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDI0ODIsImV4cCI6MjEwNDA3ODQ4Mn0.9NTTuvCBl7vgkAa9ETHqcqjd_f4sc9fD1sUBb7fk7po";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get('taskId');
    const userEmail = localStorage.getItem("user_email");

    let player, timerInterval, secondsLeft = 120;
    let taskData = null, currentQIndex = 0;

    async function loadTaskData() {
      let { data } = await supabase.from('tasks').select('*').eq('task_id', taskId);
      if (data && data[0]) {
        taskData = data[0];
        document.getElementById("taskTitle").innerText = taskData.title;
        loadYouTubePlayer(taskData.video_id);
      }
    }

    function loadYouTubePlayer(videoId) {
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, null);

      window.onYouTubeIframeAPIReady = function() {
        player = new YT.Player('player', {
          videoId: videoId,
          events: { 'onStateChange': onStateChange }
        });
      };
    }

    function onStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        if(!timerInterval) {
          timerInterval = setInterval(() => {
            if(secondsLeft > 0) {
              secondsLeft--;
              document.getElementById("timeLeft").innerText = secondsLeft;
            } else {
              clearInterval(timerInterval);
              document.getElementById("timerDisplay").innerText = "✅ Video Completed! Answer the questions:";
              document.getElementById("quizBox").style.display = "block";
              renderQuestion();
            }
          }, 1000);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function renderQuestion() {
      let q = taskData.questions[currentQIndex];
      document.getElementById("qTitle").innerText = `Q${currentQIndex + 1}: ${q.q}`;
      let optDiv = document.getElementById("optionsBox");
      optDiv.innerHTML = "";

      q.options.forEach((opt, idx) => {
        optDiv.innerHTML += `<button onclick="handleAnswer(${idx})">${opt}</button>`;
      });
    }

    async function handleAnswer(selectedIdx) {
      let q = taskData.questions[currentQIndex];
      if (selectedIdx !== q.ans) {
        return alert("Incorrect Answer! Please try again.");
      }

      currentQIndex++;
      if (currentQIndex < taskData.questions.length) {
        renderQuestion();
      } else {
        let { data } = await supabase.from('users').select('coins').eq('email', userEmail);
        let updatedCoins = (data[0]?.coins || 0) + taskData.reward_coins;

        await supabase.from('users').update({ coins: updatedCoins }).eq('email', userEmail);
        await supabase.from('user_tasks').insert([{ user_email: userEmail, task_id: taskId }]);

        alert(`🎉 Task Completed! +${taskData.reward_coins} Coins awarded.`);
        window.location.href = "index.html";
      }
    }

    loadTaskData();
  </script>
</body>
</html>
