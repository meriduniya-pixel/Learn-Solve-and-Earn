<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Task & Earn - Learn & Earn</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      margin: 0; 
      padding: 15px; 
    }

    .container { max-width: 650px; margin: auto; }

    /* Top Live Balance Header */
    .balance-header {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .user-info { font-size: 13px; color: var(--text-muted); }
    
    .coin-badge { 
      background-color: rgba(56, 189, 248, 0.1); 
      color: var(--accent-cyan); 
      border: 1px solid var(--accent-cyan);
      padding: 6px 14px; 
      border-radius: 20px; 
      font-weight: bold; 
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .withdraw-btn {
      background-color: var(--accent-green);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .withdraw-btn:hover {
      background-color: #16a34a;
    }

    /* Ad Banner Slot */
    .ad-space {
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 20px;
      background-color: rgba(30, 41, 59, 0.4);
    }

    .card { 
      background-color: var(--card-bg); 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 20px; 
      border: 1px solid var(--border-color); 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); 
    }
    
    /* Responsive Video Wrapper with Anti-Cheat Overlay */
    .video-responsive {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: #000;
    }

    .video-responsive iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Transparent Anti-Seek Overlay Barrier */
    .anti-cheat-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 80%; /* Cover progress bar area to block seeking */
      z-index: 10;
    }

    .timer-badge { 
      background-color: #0284c7; 
      color: #fff; 
      padding: 8px 16px; 
      border-radius: 20px; 
      font-weight: bold; 
      display: inline-block; 
      margin-top: 15px; 
      transition: background-color 0.3s;
    }

    .q-box { 
      background: var(--bg-color); 
      padding: 15px; 
      border-radius: 8px; 
      margin-top: 15px; 
      border-left: 4px solid var(--accent-cyan); 
    }

    .option-label { 
      display: block; 
      padding: 10px; 
      margin: 6px 0; 
      background-color: var(--card-bg); 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      cursor: pointer; 
      transition: 0.2s; 
    }

    .option-label:hover { background-color: var(--border-color); }

    button.quiz-btn { 
      width: 100%; 
      padding: 12px; 
      background-color: #2563eb; 
      color: #fff; 
      font-weight: bold; 
      border: none; 
      border-radius: 6px; 
      margin-top: 20px; 
      cursor: pointer; 
      font-size: 15px;
    }

    button:disabled { background-color: #475569; cursor: not-allowed; }

    /* Security Warning Banner */
    #cheatWarning {
      display: none;
      background-color: #ef4444;
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Top Banner Ad -->
    <div class="ad-space">[ ADSPACE: Task Page Top Banner ]</div>

    <!-- Live Coin Balance & Withdraw Header -->
    <div class="balance-header">
      <div class="user-info">
        <div>Account User</div>
        <div id="userEmailDisplay" style="color:var(--text-main); font-weight:bold;">Loading...</div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="coin-badge">
          🪙 <span id="liveCoinBalance">0</span> Coins
        </div>
        <!-- Withdraw Button with Dynamic Checking -->
        <button class="withdraw-btn" id="withdrawBtn">Withdraw 💸</button>
      </div>
    </div>

    <!-- Anti-Cheat Switch Warning -->
    <div id="cheatWarning">⚠️ Warning: Tab switching detected! Video timer paused.</div>

    <!-- Video Card -->
    <div class="card">
      <h2 style="margin-top:0; color:var(--accent-cyan);">📺 Watch Video & Earn</h2>
      
      <!-- Responsive Player with Seek Lock -->
      <div class="video-responsive">
        <div class="anti-cheat-overlay"></div>
        <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div style="text-align: center;">
        <div class="timer-badge" id="timerDisplay">Timer: Loading...</div>
      </div>
    </div>

    <!-- Questions Section -->
    <div class="card" id="quizCard" style="display: none;">
      <h3 style="margin-top:0; color:var(--accent-cyan);">📝 Answer Questions</h3>
      <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" class="quiz-btn" id="submitBtn" onclick="submitQuiz()">Submit Quiz & Earn Coin</button>
      </form>
    </div>

    <!-- Bottom Banner Ad -->
    <div class="ad-space">[ ADSPACE: Task Page Bottom Banner ]</div>

  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, update, increment, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Get Task ID & User ID
    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get('taskId');
    const storedUserId = localStorage.getItem("userId");
    const storedEmail = localStorage.getItem("userEmail");

    const userId = urlParams.get('userId') || storedUserId || "guest_user"; 

    if (storedEmail) {
      document.getElementById("userEmailDisplay").innerText = storedEmail;
    }

    let currentTask = null;
    let timerSeconds = 0;
    let timerInterval = null;
    let isTabActive = true;
    let userCoins = 0; // Store live coins

    // 1. Live Coin Balance Listener & Withdraw Lock
    if (userId !== "guest_user") {
      const userRef = ref(database, 'users/' + userId);
      onValue(userRef, (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          userCoins = data.coins || 0;
          document.getElementById("liveCoinBalance").innerText = userCoins;
        }
      });
    }

    // Withdraw Button Click Handling (500 Coins Limit)
    document.getElementById("withdrawBtn").addEventListener("click", () => {
      if (userCoins >= 500) {
        window.location.href = "withdraw.html";
      } else {
        alert(`⚠️ First complete required coins!\n\nMinimum 500 coins needed to withdraw.\nYour Current Balance: ${userCoins} Coins.`);
      }
    });

    // 2. Fetch Task Data
    if (taskId) {
      get(ref(database, 'tasks/' + taskId)).then((snapshot) => {
        if (snapshot.exists()) {
          currentTask = snapshot.val();
          loadVideo(currentTask.videoId);
          startTimer(currentTask.timerSeconds || 30);
        } else {
          document.body.innerHTML = "<h2 style='color:white; text-align:center;'>Task Not Found!</h2>";
        }
      });
    } else {
      document.body.innerHTML = "<h2 style='color:white; text-align:center;'>No Task Specified!</h2>";
    }

    function extractYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    // Disable YouTube controls to prevent forwarding
    function loadVideo(rawId) {
      const cleanId = extractYouTubeId(rawId);
      document.getElementById("youtubePlayer").src = `https://www.youtube.com/embed/${cleanId}?enablejsapi=1&controls=0&rel=0`;
    }

    // 3. Timer with Anti-Cheat Switch Guard
    function startTimer(seconds) {
      timerSeconds = seconds;
      const display = document.getElementById("timerDisplay");
      
      timerInterval = setInterval(() => {
        if (isTabActive) {
          timerSeconds--;
          display.innerText = `Please wait: ${timerSeconds}s`;

          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            display.innerText = "✅ Video Watch Time Complete!";
            display.style.backgroundColor = "#16a34a";
            showQuiz();
          }
        }
      }, 1000);
    }

    // Anti-Cheat: Detect Tab Switch
    document.addEventListener("visibilitychange", () => {
      const warningBanner = document.getElementById("cheatWarning");
      if (document.hidden) {
        isTabActive = false;
        if(warningBanner) warningBanner.style.display = "block";
      } else {
        isTabActive = true;
        if(warningBanner) warningBanner.style.display = "none";
      }
    });

    function showQuiz() {
      if (!currentTask.questions || currentTask.questions.length === 0) {
        alert("No quiz for this task. Reward added!");
        grantReward();
        return;
      }

      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      currentTask.questions.forEach((qObj, index) => {
        const qHTML = `
          <div class="q-box">
            <p style="font-weight:bold; margin-top:0;">Q${index + 1}: ${qObj.q}</p>
            ${qObj.options.map((opt, i) => {
              const optKey = String.fromCharCode(65 + i);
              return `
                <label class="option-label">
                  <input type="radio" name="q_${index}" value="${optKey}">
                  ${optKey}) ${opt}
                </label>
              `;
            }).join('')}
          </div>
        `;
        container.innerHTML += qHTML;
      });

      document.getElementById("quizCard").style.display = "block";
    }

    window.submitQuiz = function() {
      let allCorrect = true;

      currentTask.questions.forEach((qObj, index) => {
        const selected = document.querySelector(`input[name="q_${index}"]:checked`);
        if (!selected || selected.value !== qObj.ans) {
          allCorrect = false;
        }
      });

      if (allCorrect) {
        alert("🎉 Correct Answers! 1 Coin Credited to your account.");
        grantReward();
      } else {
        alert("❌ Incorrect answers. Please try again!");
      }
    };

    function grantReward() {
      // Increment 1 Coin per completed task
      update(ref(database, 'users/' + userId), {
        coins: increment(1)
      }).then(() => {
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
