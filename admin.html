<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 700px; margin: auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .stat-number { font-size: 42px; font-weight: bold; text-align: center; color: #38bdf8; margin: 10px 0; }
    label { display: block; margin-top: 10px; font-size: 14px; color: #94a3b8; }
    input, select, textarea, button { width: 100%; padding: 12px; margin-top: 6px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 14px; }
    button { background-color: #2563eb; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; transition: 0.2s; }
    button:hover { background-color: #1d4ed8; }
    .btn-add { background-color: #0284c7; }
    .btn-delete { background-color: #dc2626; padding: 6px 12px; width: auto; font-size: 12px; margin: 0; }
    .q-box { border-left: 3px solid #38bdf8; padding-left: 12px; margin-top: 15px; background: #0f172a; padding-top: 5px; border-radius: 4px; }
    .task-item, .withdraw-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚙️ Admin Control Panel</h1>

    <!-- Stats -->
    <div class="card">
      <h3>👥 Total Registered Users</h3>
      <div class="stat-number" id="userCount">0</div>
    </div>

    <!-- Create Task -->
    <div class="card">
      <h3>➕ Create New Task</h3>
      <label>YouTube Video ID (e.g. M7lcTUVf-VE):</label>
      <input type="text" id="videoId" placeholder="Enter Video ID">

      <label>Watch Time Required (in Seconds):</label>
      <input type="number" id="videoTimer" placeholder="e.g. 120">

      <div id="questionsContainer"></div>

      <button type="button" class="btn-add" onclick="addQuestionField()">+ Add Question</button>
      <button type="button" onclick="saveTaskToFirebase()">Publish Task</button>
    </div>

    <!-- Manage Tasks -->
    <div class="card">
      <h3>🗑️ Manage & Delete Tasks</h3>
      <div id="taskList">Loading tasks...</div>
    </div>

    <!-- Pending Withdrawals -->
    <div class="card">
      <h3>💸 Pending Withdrawal Requests</h3>
      <div id="withdrawList">Loading...</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let qCount = 0;

    window.addQuestionField = function() {
      qCount++;
      const container = document.getElementById("questionsContainer");
      const qHTML = `
        <div class="q-box" id="q_${qCount}">
          <h4>Question ${qCount}</h4>
          <input type="text" class="q-text" placeholder="Question Title">
          <input type="text" class="opt-a" placeholder="Option A">
          <input type="text" class="opt-b" placeholder="Option B">
          <input type="text" class="opt-c" placeholder="Option C">
          <input type="text" class="opt-d" placeholder="Option D">
          <select class="correct-opt">
            <option value="">Correct Answer</option>
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
          </select>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', qHTML);
    };

    window.saveTaskToFirebase = function() {
      const videoId = document.getElementById("videoId").value.trim();
      const videoTimer = parseInt(document.getElementById("videoTimer").value);

      if(!videoId || !videoTimer) { alert("Fill Video ID and Timer!"); return; }

      const questions = [];
      for(let i=1; i<=qCount; i++) {
        const qBox = document.getElementById(`q_${i}`);
        if(qBox) {
          questions.push({
            q: qBox.querySelector('.q-text').value,
            options: [
              qBox.querySelector('.opt-a').value,
              qBox.querySelector('.opt-b').value,
              qBox.querySelector('.opt-c').value,
              qBox.querySelector('.opt-d').value
            ],
            ans: qBox.querySelector('.correct-opt').value
          });
        }
      }

      push(ref(database, 'tasks'), {
        videoId: videoId,
        timerSeconds: videoTimer,
        questions: questions
      }).then(() => {
        alert("Task Published!");
        location.reload();
      });
    };

    // Load Tasks & Delete Feature
    onValue(ref(database, 'tasks'), (snapshot) => {
      const taskList = document.getElementById("taskList");
      taskList.innerHTML = "";
      if(!snapshot.exists()) { taskList.innerHTML = "No active tasks."; return; }

      snapshot.forEach((child) => {
        const data = child.val();
        const key = child.key;
        taskList.innerHTML += `
          <div class="task-item">
            <span><b>ID:</b> ${data.videoId} (${data.timerSeconds}s)</span>
            <button class="btn-delete" onclick="deleteTask('${key}')">Delete</button>
          </div>
        `;
      });
    });

    window.deleteTask = function(key) {
      if(confirm("Delete this task?")) {
        remove(ref(database, 'tasks/' + key));
      }
    };

    // Load User Stats
    onValue(ref(database, 'users'), (snapshot) => {
      document.getElementById("userCount").innerText = snapshot.exists() ? snapshot.size : 0;
    });

    // Auto load first question box
    window.addQuestionField();
  </script>
</body>
</html>
