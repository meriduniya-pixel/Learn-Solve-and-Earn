<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Learn & Earn</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2, h3 {
      color: var(--accent-cyan);
      margin-top: 0;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      box-sizing: border-box;
    }

    button {
      padding: 10px 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-green { background-color: var(--accent-green); }
    .btn-red { background-color: var(--accent-red); }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Admin Login Section -->
    <div id="loginSection" class="card">
      <h2>🔐 Admin Authentication</h2>
      <p style="color: var(--text-muted); font-size: 13px;">Restricted area. Unauthorized access is logged.</p>
      <input type="email" id="adminEmail" placeholder="Admin Email">
      <input type="password" id="adminPassword" placeholder="Admin Password">
      <button onclick="handleAdminLogin()">Login to Dashboard</button>
    </div>

    <!-- Admin Panel (Shown only after verification) -->
    <div id="adminPanel" class="hidden">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>⚙️ Admin Control Panel</h2>
        <button class="btn-red" onclick="handleAdminLogout()">Logout</button>
      </div>

      <!-- 1. Ads Management Section -->
      <div class="card">
        <h3>📢 Ads Management System</h3>
        <label style="font-size: 13px; color: var(--text-muted);">Top Ad Banner Code (HTML / JS Script):</label>
        <textarea id="topAdCode" rows="3" placeholder="Paste Adsterra / Google AdSense code for Top Banner"></textarea>

        <label style="font-size: 13px; color: var(--text-muted);">Bottom Ad Banner Code (HTML / JS Script):</label>
        <textarea id="bottomAdCode" rows="3" placeholder="Paste Adsterra / Google AdSense code for Bottom Banner"></textarea>

        <button class="btn-green" onclick="saveAdsCode()">Save Ads Code</button>
      </div>

      <!-- 2. Create New Task Section -->
      <div class="card">
        <h3>🎬 Add New Task Video</h3>
        <input type="text" id="taskVideoId" placeholder="YouTube Video URL or ID">
        <input type="number" id="taskTimer" placeholder="Watch Timer (in seconds, e.g. 30)">
        
        <h4>Quiz Questions (Optional)</h4>
        <input type="text" id="q1Text" placeholder="Question 1">
        <input type="text" id="q1OptA" placeholder="Option A">
        <input type="text" id="q1OptB" placeholder="Option B">
        <input type="text" id="q1OptC" placeholder="Option C">
        <input type="text" id="q1OptD" placeholder="Option D">
        <input type="text" id="q1Ans" placeholder="Correct Answer (A/B/C/D)">

        <button class="btn-green" onclick="createNewTask()">Publish Task</button>
      </div>

    </div>

  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // Dynamic Admin Email Lock
    const AUTHORIZED_ADMIN_EMAIL = "sanjusomvirthalor@gmail.com";

    // Auth State Monitor
    onAuthStateChanged(auth, (user) => {
      if (user && user.email === AUTHORIZED_ADMIN_EMAIL) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadExistingAds();
      } else {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("adminPanel").classList.add("hidden");
      }
    });

    // Admin Login Function
    window.handleAdminLogin = function() {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value.trim();

      if (email !== AUTHORIZED_ADMIN_EMAIL) {
        alert("🚫 Access Denied: This email is not authorized as Admin!");
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("✅ Admin Access Granted!");
        })
        .catch((error) => {
          alert("Login Failed: " + error.message);
        });
    };

    // Logout Function
    window.handleAdminLogout = function() {
      signOut(auth).then(() => {
        alert("Logged out successfully.");
      });
    };

    // Load Existing Ads Code
    function loadExistingAds() {
      get(ref(database, 'adsSettings')).then((snapshot) => {
        if (snapshot.exists()) {
          const ads = snapshot.val();
          document.getElementById("topAdCode").value = ads.topAdCode || "";
          document.getElementById("bottomAdCode").value = ads.bottomAdCode || "";
        }
      });
    }

    // Save Ads Code
    window.saveAdsCode = function() {
      const topAd = document.getElementById("topAdCode").value;
      const bottomAd = document.getElementById("bottomAdCode").value;

      set(ref(database, 'adsSettings'), {
        topAdCode: topAd,
        bottomAdCode: bottomAd,
        updatedAt: new Date().toISOString()
      }).then(() => {
        alert("🎉 Ads Code Updated Successfully!");
      }).catch((err) => {
        alert("Error updating ads: " + err.message);
      });
    };

    // Create Task Function
    window.createNewTask = function() {
      const videoId = document.getElementById("taskVideoId").value.trim();
      const timerSeconds = parseInt(document.getElementById("taskTimer").value) || 30;

      const qText = document.getElementById("q1Text").value.trim();
      const qAns = document.getElementById("q1Ans").value.trim().toUpperCase();

      if (!videoId) {
        alert("Please enter a Video ID/URL!");
        return;
      }

      let questions = [];
      if (qText && qAns) {
        questions.push({
          q: qText,
          options: [
            document.getElementById("q1OptA").value,
            document.getElementById("q1OptB").value,
            document.getElementById("q1OptC").value,
            document.getElementById("q1OptD").value
          ],
          ans: qAns
        });
      }

      const newTaskRef = push(ref(database, 'tasks'));
      set(newTaskRef, {
        videoId: videoId,
        timerSeconds: timerSeconds,
        questions: questions,
        createdAt: new Date().toISOString()
      }).then(() => {
        alert("✅ Task Published Successfully!");
        document.getElementById("taskVideoId").value = "";
      }).catch((err) => alert("Error adding task: " + err.message));
    };
  </script>
</body>
</html>
