<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidQuiz Admin Panel</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; max-width: 600px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #218838; }
    .btn-add { background: #007bff; margin-bottom: 15px; }
    .q-box { border-left: 4px solid #007bff; padding-left: 10px; margin-top: 15px; background: #f9f9f9; padding-top: 5px; }
  </style>
</head>
<body>

  <h2>VidQuiz Admin Panel - Create Task</h2>

  <div class="card">
    <label><b>YouTube Video ID</b> (e.g. dQw4w9WgXcQ):</label>
    <input type="text" id="videoId" placeholder="Enter Video ID">

    <label><b>Required Watch Time (in Seconds):</b></label>
    <input type="number" id="videoTimer" placeholder="e.g. 120 for 2 mins, 600 for 10 mins">

    <div id="questionsContainer"></div>

    <button type="button" class="btn-add" onclick="addQuestionField()">+ Add Question</button>
    <button type="button" onclick="saveTaskToFirebase()">Publish Task to Database</button>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Aapka Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let qCount = 0;

    window.addQuestionField = function() {
      qCount++;
      const container = document.getElementById("questionsContainer");
      const qHTML = `
        <div class="q-box" id="q_${qCount}">
          <h4>Question ${qCount}</h4>
          <input type="text" class="q-text" placeholder="Enter Question">
          <input type="text" class="opt-a" placeholder="Option A">
          <input type="text" class="opt-b" placeholder="Option B">
          <input type="text" class="opt-c" placeholder="Option C">
          <input type="text" class="opt-d" placeholder="Option D">
          <select class="correct-opt">
            <option value="">Select Correct Option</option>
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
          </select>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', qHTML);
    };

    window.saveTaskToFirebase = function() {
      const videoId = document.getElementById("videoId").value.trim();
      const videoTimer = parseInt(document.getElementById("videoTimer").value);

      if(!videoId || !videoTimer) {
        alert("Please enter Video ID and Timer!");
        return;
      }

      const questions = [];
      for(let i=1; i<=qCount; i++) {
        const qBox = document.getElementById(`q_${i}`);
        if(qBox) {
          questions.push({
            question: qBox.querySelector('.q-text').value,
            options: {
              A: qBox.querySelector('.opt-a').value,
              B: qBox.querySelector('.opt-b').value,
              C: qBox.querySelector('.opt-c').value,
              D: qBox.querySelector('.opt-d').value
            },
            answer: qBox.querySelector('.correct-opt').value
          });
        }
      }

      // Firebase database mein save
      const tasksRef = ref(database, 'tasks');
      push(tasksRef, {
        videoId: videoId,
        timerSeconds: videoTimer,
        questions: questions,
        createdAt: Date.now()
      }).then(() => {
        alert("Task Successfully Published to Database!");
        location.reload();
      }).catch((err) => {
        alert("Error: " + err.message);
      });
    };

    // Auto load first question field
    window.addQuestionField();
  </script>
</body>
</html>
