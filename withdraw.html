<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw Rewards - Learn & Earn</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .container { max-width: 500px; margin: 20px auto; }

    /* Ad Banner Slot */
    .ad-space {
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 20px;
      background-color: rgba(30, 41, 59, 0.4);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .balance-box {
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
    
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-green);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background-color: #16a34a; }

    .back-btn {
      background-color: #334155;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      border: none;
      cursor: pointer;
      display: inline-block;
      font-weight: 500;
      margin-bottom: 15px;
    }

    /* Anti-AdBlock Modal Styling */
    #adblock-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .adblock-modal {
      background-color: var(--card-bg);
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 25px;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.2);
    }

    .adblock-modal h2 { color: #ef4444; margin-top: 0; font-size: 22px; }
    .adblock-modal p { color: var(--text-main); font-size: 14px; margin-bottom: 20px; }
    .btn-refresh { background-color: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Anti-AdBlock Warning Modal -->
  <div id="adblock-overlay">
    <div class="adblock-modal">
      <h2>🛡️ AdBlocker Detected!</h2>
      <p>Aapke browser mein AdBlocker enabled hai. Withdrawal proceed karne ke liye please AdBlocker ko Disable karein aur page Refresh karein.</p>
      <button class="btn-refresh" onclick="window.location.reload()">Refresh Page 🔄</button>
    </div>
  </div>

  <div class="container">
    <a href="dashboard.html" class="back-btn">⬅️ Back to Dashboard</a>

    <!-- Top Dynamic Banner Ad -->
    <div class="ad-space" id="topAdSpace">Loading Top Ad...</div>

    <div class="card">
      <h2 style="margin-top:0; color:var(--accent-cyan); text-align:center;">🎁 Redeem Rewards</h2>
      
      <div class="balance-box">
        <span style="font-size: 14px; color: var(--text-muted);">Available Coins</span>
        <h1 style="margin: 5px 0 0 0; color: var(--accent-cyan);" id="coinDisplay">0</h1>
      </div>

      <form id="withdrawForm">
        <label>Payment Method</label>
        <select id="payoutMethod" onchange="toggleFields()">
          <option value="UPI">Direct UPI Payment (Min 1000 Coins = ₹5)</option>
          <option value="Amazon">Amazon Gift Voucher (Min 1000 Coins = ₹5)</option>
        </select>

        <label>Select Coin Amount</label>
        <select id="coinAmount">
          <option value="1000">1000 Coins (₹5)</option>
          <option value="2000">2000 Coins (₹10)</option>
          <option value="10000">10000 Coins (₹50)</option>
        </select>

        <div id="upiField">
          <label>UPI ID (Google Pay, PhonePe, Paytm)</label>
          <input type="text" id="upiIdInput" placeholder="example@upi" autocomplete="off">
        </div>

        <button type="button" onclick="handleWithdrawal()">Submit Request</button>
      </form>
    </div>

    <!-- Bottom Dynamic Banner Ad -->
    <div class="ad-space" id="bottomAdSpace">Loading Bottom Ad...</div>
  </div>

  <!-- Anti-Hacking Protection Script: Block DevTools Keyboard Shortcuts -->
  <script>
    document.addEventListener("keydown", function(e) {
      if (e.keyCode == 123 || 
         (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
         (e.ctrlKey && e.keyCode == 85)) {
        e.preventDefault();
        return false;
      }
    });
  </script>

  <!-- Dummy script file to trigger AdBlock filters -->
  <script src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" onError="adBlockDetected()"></script>

  <!-- Anti-AdBlock Script -->
  <script>
    let isAdBlockActive = false;

    function adBlockDetected() {
      isAdBlockActive = true;
      document.getElementById("adblock-overlay").style.display = "flex";
    }

    window.addEventListener("load", () => {
      const bait = document.createElement("div");
      bait.className = "adsbygoogle ad-zone ad-space google-ad";
      bait.style.cssText = "width:1px;height:1px;position:absolute;left:-999px;top:-999px;";
      document.body.appendChild(bait);

      setTimeout(() => {
        if (bait.offsetParent === null || bait.offsetHeight === 0 || bait.clientHeight === 0) {
          adBlockDetected();
        }
        bait.remove();
      }, 300);
    });
  </script>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, push, update, increment, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    function sanitizeInput(str) {
      if (!str) return "";
      return str.replace(/[<>'"\/]/g, "").trim();
    }

    const userId = sanitizeInput(localStorage.getItem("userId"));
    const userEmail = sanitizeInput(localStorage.getItem("userEmail"));
    let currentCoins = 0;
    let cachedTopAdCode = "";
    let cachedBottomAdCode = "";

    // Dynamic Script Execution Helper for Ads
    function renderAdCode(containerId, adCode) {
      const container = document.getElementById(containerId);
      if (!container || !adCode) return;
      
      container.innerHTML = adCode;
      const scripts = container.getElementsByTagName("script");
      for (let i = 0; i < scripts.length; i++) {
        const newScript = document.createElement("script");
        if (scripts[i].src) {
          newScript.src = scripts[i].src;
        } else {
          newScript.textContent = scripts[i].textContent;
        }
        document.body.appendChild(newScript);
      }
    }

    // Dynamic Ads Listener from Firebase Database (Supports withdraw_html & index_html fallback)
    onValue(ref(database, 'ads/withdraw_html_top'), (snapshot) => {
      if (snapshot.exists() && snapshot.val().code) {
        cachedTopAdCode = snapshot.val().code;
        renderAdCode("topAdSpace", cachedTopAdCode);
      } else {
        onValue(ref(database, 'ads/index_html_top'), (snap) => {
          if (snap.exists() && snap.val().code) {
            cachedTopAdCode = snap.val().code;
            renderAdCode("topAdSpace", cachedTopAdCode);
          }
        }, { onlyOnce: true });
      }
    });

    onValue(ref(database, 'ads/withdraw_html_bottom'), (snapshot) => {
      if (snapshot.exists() && snapshot.val().code) {
        cachedBottomAdCode = snapshot.val().code;
        renderAdCode("bottomAdSpace", cachedBottomAdCode);
      } else {
        onValue(ref(database, 'ads/index_html_bottom'), (snap) => {
          if (snap.exists() && snap.val().code) {
            cachedBottomAdCode = snap.val().code;
            renderAdCode("bottomAdSpace", cachedBottomAdCode);
          }
        }, { onlyOnce: true });
      }
    });

    // 15-SECOND AUTO AD-RELOADER LOOP FOR MAX REVENUE
    setInterval(() => {
      if (!window.isAdBlockActive) {
        if (cachedTopAdCode) renderAdCode("topAdSpace", cachedTopAdCode);
        if (cachedBottomAdCode) renderAdCode("bottomAdSpace", cachedBottomAdCode);
      }
    }, 15000);

    window.toggleFields = function() {
      const method = document.getElementById("payoutMethod").value;
      const upiField = document.getElementById("upiField");
      if (method === "UPI") {
        upiField.style.display = "block";
      } else {
        upiField.style.display = "none";
      }
    };

    if (!userId) {
      alert("Please login first!");
      window.location.href = "index.html";
    } else {
      onValue(ref(database, 'users/' + userId), (snapshot) => {
        if (snapshot.exists()) {
          currentCoins = snapshot.val().coins || 0;
          document.getElementById("coinDisplay").innerText = currentCoins;
        }
      });
    }

    window.handleWithdrawal = function() {
      if (window.isAdBlockActive) {
        alert("⚠️ Please disable AdBlocker to submit withdrawal request!");
        document.getElementById("adblock-overlay").style.display = "flex";
        return;
      }

      const requiredCoins = parseInt(document.getElementById("coinAmount").value);
      const method = document.getElementById("payoutMethod").value;
      const upiId = sanitizeInput(document.getElementById("upiIdInput").value);

      if (method === "UPI" && !upiId) {
        alert("Please enter a valid UPI ID!");
        return;
      }

      // Hardened Verification: Re-fetch latest balance directly from Database before processing
      get(ref(database, 'users/' + userId)).then((snapshot) => {
        if (snapshot.exists()) {
          const freshBalance = snapshot.val().coins || 0;

          if (freshBalance < requiredCoins) {
            alert("🚫 Insufficient balance! You need at least " + requiredCoins + " coins. Realtime balance: " + freshBalance);
            return;
          }

          // 1. Deduct coins from user balance
          update(ref(database, 'users/' + userId), {
            coins: increment(-requiredCoins)
          });

          // 2. Add redemption entry to admin panel node
          push(ref(database, 'withdraw_requests'), {
            userId: userId,
            email: userEmail,
            coinsRedeemed: requiredCoins,
            amountRupees: (requiredCoins * 5) / 1000,
            payoutMethod: method,
            accountDetails: method === "UPI" ? upiId : userEmail,
            status: "PENDING",
            requestedAt: new Date().toISOString()
          }).then(() => {
            alert("✅ Withdrawal request submitted successfully! Status: PENDING");
            window.location.href = "dashboard.html";
          });
        }
      });
    };
  </script>
</body>
</html>
