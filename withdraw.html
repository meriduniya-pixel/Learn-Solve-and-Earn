<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw Rewards - Learn & Earn</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
    }

    .container { max-width: 500px; margin: 30px auto; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .balance-box {
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
    
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-green);
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background-color: #16a34a; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2 style="margin-top:0; color:var(--accent-cyan); text-align:center;">🎁 Redeem Rewards</h2>
      
      <div class="balance-box">
        <span style="font-size: 14px; color: var(--text-muted);">Available Coins</span>
        <h1 style="margin: 5px 0 0 0; color: var(--accent-cyan);" id="coinDisplay">0</h1>
      </div>

      <form id="withdrawForm">
        <label>Payment Method</label>
        <select id="payoutMethod" onchange="toggleFields()">
          <option value="UPI">Direct UPI Payment (Min 500 Coins = ₹5)</option>
          <option value="Amazon">Amazon Gift Voucher (Min 500 Coins = ₹5)</option>
        </select>

        <label>Select Coin Amount</label>
        <select id="coinAmount">
          <option value="500">500 Coins (₹5)</option>
          <option value="1000">1000 Coins (₹10)</option>
          <option value="2000">2000 Coins (₹20)</option>
        </select>

        <div id="upiField">
          <label>UPI ID (Google Pay, PhonePe, Paytm)</label>
          <input type="text" id="upiIdInput" placeholder="example@upi">
        </div>

        <button type="button" onclick="handleWithdrawal()">Submit Request</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, push, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB13vZKTOcxKmkLC9j2RrrY_LQFr254Njk",
      authDomain: "vidquiz-plateform.firebaseapp.com",
      projectId: "vidquiz-plateform",
      storageBucket: "vidquiz-plateform.firebasestorage.app",
      messagingSenderId: "296367717015",
      appId: "1:296367717015:web:b31e8b3f3a03218d78c7d2",
      databaseURL: "https://vidquiz-plateform-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const userId = localStorage.getItem("userId");
    const userEmail = localStorage.getItem("userEmail");
    let currentCoins = 0;

    if (!userId) {
      alert("Please login first!");
      window.location.href = "index.html";
    } else {
      get(ref(database, 'users/' + userId)).then((snapshot) => {
        if (snapshot.exists()) {
          currentCoins = snapshot.val().coins || 0;
          document.getElementById("coinDisplay").innerText = currentCoins;
        }
      });
    }

    window.handleWithdrawal = function() {
      const requiredCoins = parseInt(document.getElementById("coinAmount").value);
      const method = document.getElementById("payoutMethod").value;
      const upiId = document.getElementById("upiIdInput").value.trim();

      if (currentCoins < requiredCoins) {
        alert("🚫 Insufficient balance! You need at least " + requiredCoins + " coins.");
        return;
      }

      if (method === "UPI" && !upiId) {
        alert("Please enter a valid UPI ID!");
        return;
      }

      // 1. Deduct coins from user balance
      update(ref(database, 'users/' + userId), {
        coins: increment(-requiredCoins)
      });

      // 2. Add redemption entry to admin panel node
      push(ref(database, 'withdraw_requests'), {
        userId: userId,
        email: userEmail,
        coinsRedeemed: requiredCoins,
        amountRupees: requiredCoins / 100,
        payoutMethod: method,
        accountDetails: method === "UPI" ? upiId : userEmail,
        status: "PENDING",
        requestedAt: new Date().toISOString()
      }).then(() => {
        alert("✅ Withdrawal request submitted! Status: PENDING");
        window.location.href = "index.html";
      });
    };
  </script>
</body>
</html>
